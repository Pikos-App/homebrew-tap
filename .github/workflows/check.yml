# Does the tap still install?
#
# Version drift against a new release is checked weekly from the app repo, which is the only
# side that knows what has shipped. This side answers the other half: whether a change made
# here parses, audits and downloads. Both halves have to exist, because a tap that is correct
# on Monday can be broken by an edit on Tuesday and nobody finds out until an install fails.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ${{ matrix.os }}
    # `brew audit --online` asks the GitHub API about every release it checks, and unauthenticated
    # runners share a 60-per-hour limit that this workflow exhausts on its own.
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # Copied into place rather than tapped from GitHub, so a pull request is audited as it
      # would land instead of as main already is.
      - name: Install this checkout as the tap
        run: |
          # Both: GITHUB_PATH only reaches the *next* step, and brew is needed in this one.
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          tap_dir="$(brew --repository)/Library/Taps/pikos-app/homebrew-tap"
          rm -rf "$tap_dir"
          mkdir -p "$(dirname "$tap_dir")"
          cp -R "$GITHUB_WORKSPACE" "$tap_dir"
          brew tap | grep -qx "pikos-app/tap"

      # --online fetches the URLs, which is what catches a checksum that no longer matches the
      # asset. A local audit cannot see that.
      - name: Audit
        run: |
          brew audit --strict --online pikos-app/tap/pikos-cli
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew audit --strict --online --cask pikos-app/tap/pikos
            # Offline, then fetched. --online objects to a pre-release cask on principle —
            # that it points at a pre-release, and that livecheck finds the stable tag
            # instead — and both are what this cask is for. `brew fetch` still proves the
            # URL and the checksum, which is the part a change here can break.
            brew audit --strict --cask pikos-app/tap/pikos@beta
            brew fetch --cask pikos-app/tap/pikos@beta
          fi

      # A deprecated stanza warns rather than failing the audit, and that is exactly how a tap
      # stops working one Homebrew release later. Treat the warning as the failure it will become.
      - name: Refuse a deprecated stanza
        if: runner.os == 'macOS'
        run: |
          for cask in pikos pikos@beta; do
            if brew fetch --cask --force "pikos-app/tap/$cask" 2>&1 | grep -q "deprecated"; then
              echo "pikos-app/tap/$cask uses a deprecated stanza"
              exit 1
            fi
          done

      - name: Install and run
        run: |
          brew install pikos-app/tap/pikos-cli
          brew test pikos-app/tap/pikos-cli
