# Does the tap still install?
#
# Version drift against a new release is checked weekly from the app repo, which is the only
# side that knows what has shipped. This side answers the other half: whether a change made
# here parses, audits and points at the right files. Both halves have to exist, because a tap
# that is correct on Monday can be broken by an edit on Tuesday and nobody finds out until an
# install fails.
#
# Nothing here downloads a release asset except the install job, and that runs only when the
# formula changes. GitHub counts a runner fetching an asset as a download, the same as a person,
# and Pikos's install numbers are read from those counts.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # Copied into place rather than tapped from GitHub, so a pull request is audited as it
      # would land instead of as main already is.
      - name: Install this checkout as the tap
        run: |
          # Both: GITHUB_PATH only reaches the *next* step, and brew is needed in this one.
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          tap_dir="$(brew --repository)/Library/Taps/pikos-app/homebrew-tap"
          rm -rf "$tap_dir"
          mkdir -p "$(dirname "$tap_dir")"
          cp -R "$GITHUB_WORKSPACE" "$tap_dir"
          brew tap | grep -qx "pikos-app/tap"

      # A deprecated stanza warns rather than failing the audit, and that is exactly how a tap
      # stops working one Homebrew release later. Treat the warning as the failure it will become.
      - name: Audit
        run: |
          set -o pipefail
          {
            brew audit --strict pikos-app/tap/pikos-cli
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew audit --strict --cask pikos-app/tap/pikos
              brew audit --strict --cask pikos-app/tap/pikos@beta
            fi
          } 2>&1 | tee audit.log
          if grep -q "deprecated" audit.log; then
            echo "the tap uses a deprecated stanza"
            exit 1
          fi

  # Stands in for `brew audit --online` and `brew fetch`, which proved the same thing by
  # downloading every asset on every run.
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every url and sha256 matches a published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/check-digests.sh
